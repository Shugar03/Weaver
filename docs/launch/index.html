  at(24.38, (t) => shimmer(t, 1.6));
  at(T(13), (t) => riser(t, BAR, 0.28));
  at(T(14), (t) => { impact(t, 1); stab(t, [57, 60, 64, 69], 0.2); whoosh(t, 2, 0.16); });
  at(27.05, (t) => riser(t, 0.9, 0.08));
  at(END, (t) => { impact(t, 0.75); stab(t, [45, 57, 64, 69], 0.18); pad(t, 1.2, [57, 64, 69], 0.08); });
}

/* ================= TRANSPORT ================= */
let clock = null, running = false, endShown = false;
const gate = $("gate");
function syncDom(t) {
  const h = $("hash");
  if (t >= 19.5 && t < 20.4) { const f = Math.floor(t * 40); let s = ""; for (let i = 0; i < 8; i++) s += "0123456789abcdef"[Math.floor(hash1(f * 8 + i) * 16)]; h.textContent = "sha256:" + s; $("status").textContent = "PENDING"; $("status").className = ""; }
  else if (t >= 20.4) { h.textContent = "sha256:a41f…c07e"; if (t >= 21.05) { $("status").textContent = "SETTLED ✓"; $("status").className = "ok"; } }
}
function frame() {
  if (!clock || window.__noTick) return;
  const t = clock();
  tl.time(clamp(t, 0, DUR));
  draw(clamp(t, 0, DUR));
  syncDom(clamp(t, 0, DUR));
  if (running && t > DUR + 0.6 && !endShown) { endShown = true; running = false; $("playLabel").textContent = COPY.replay; gate.classList.remove("off"); AC && AC.suspend(); }
}
async function start(off = 0) {
  if (AC) { try { await AC.close(); } catch {} }
  initAudio(); await AC.resume();
  songOff = off; t0 = AC.currentTime + 0.12; schedule();
  clock = () => AC.currentTime - t0 + songOff - (AC.outputLatency || 0);
  running = true; endShown = false; gate.classList.add("off");
}
$("play").addEventListener("click", () => start(parseFloat(Q.get("t")) || 0));
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (!AC || !running) return; AC.state === "running" ? AC.suspend() : AC.resume(); }
  if (e.key === "r" || e.key === "R") start(0);
  if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});

(async () => {
  fit();
  await Promise.all([document.fonts.load('600 54px "Space Grotesk"'), document.fonts.load("23px VT323"), document.fonts.load('400 30px "Space Grotesk"')]);
  await document.fonts.ready;
  await buildLogo(); buildPrompt();
  // pre-warm the blur/texture raster path so the first reveals don't hitch
  const warm = document.createElement("div");
  warm.style.cssText = "position:absolute;left:-9999px;top:0;font:600 54px 'Space Grotesk';color:#fff";
  warm.textContent = "warm";
  warm.innerHTML += "<div class='chip'><span>w</span><i></i></div>";
  document.getElementById("stage").appendChild(warm);
  gsap.fromTo(warm, { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.3, onComplete: () => warm.remove() });
  gsap.ticker.lagSmoothing(0);
  gsap.ticker.add(frame);
  const freeze = Q.get("freeze");
  if (Q.has("render")) {
    window.__noTick = true; clock = () => 0; gate.classList.add("off");
    window.__seek = (t) => { tl.time(t); draw(t); syncDom(t); };
    window.__renderAudio = async () => {
      const OC = new OfflineAudioContext(2, Math.ceil(DUR * 48000), 48000);
      initAudio(OC); t0 = 0; songOff = 0; schedule();
      const buf = await OC.startRendering();
      const L = buf.getChannelData(0), R = buf.getChannelData(1), n = buf.length;
      const wav = new ArrayBuffer(44 + n * 4), dv = new DataView(wav), ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
      ws(0, "RIFF"); dv.setUint32(4, 36 + n * 4, true); ws(8, "WAVEfmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
      dv.setUint32(24, 48000, true); dv.setUint32(28, 192000, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, "data"); dv.setUint32(40, n * 4, true);
      for (let i = 0; i < n; i++) {
        const a = Math.max(-1, Math.min(1, L[i])), b = Math.max(-1, Math.min(1, R[i]));
        dv.setInt16(44 + i * 4, a * 32767, true); dv.setInt16(44 + i * 4 + 2, b * 32767, true);
      }
      const bytes = new Uint8Array(wav); let bin = "";
      for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
      return btoa(bin);
    };
  }
  else if (Q.has("preview")) { const s = performance.now() / 1000 - (parseFloat(Q.get("t")) || 0); clock = () => performance.now() / 1000 - s; gate.classList.add("off"); }
  else if (freeze !== null) { clock = () => parseFloat(freeze); gate.classList.add("off"); }
  else clock = () => 28.9;   // poster frame behind the gate
})();
})();
